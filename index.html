<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style id="estilos">
  :root{
    --crema: #fbf3ec;
    --crema-2: #f4e6da;
    --papel: #fffaf4;
    --terracota: #c8886b;
    --terracota-oscuro: #a5654a;
    --texto: #3a2e2a;
    --texto-suave: #6f5f58;
    --blanco: #ffffff;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--crema);
    color: var(--texto);
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, .titulo{
    font-family: 'Playfair Display', serif;
  }

  /* ---------- HERO ---------- */
  .hero{
    position: relative;
    min-height: 92vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background-size: cover;
    background-position: center 25%;
    padding: 24px 20px 56px;
    text-align: center;
    color: var(--blanco);
  }

  .hero-contenido{ max-width: 640px; }

  .hero .eyebrow{
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 0.75rem;
    opacity: 0.85;
    margin: 0 0 14px;
  }

  .hero h1{
    font-size: clamp(2.4rem, 7vw, 4rem);
    margin: 0 0 14px;
    font-weight: 700;
    text-wrap: balance;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
  }

  .hero p{
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    font-weight: 300;
    opacity: 0.95;
    margin: 0;
  }

  .scroll-cue{
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.6rem;
    opacity: 0.8;
    animation: rebote 2.2s infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .scroll-cue{ animation: none; }
  }

  @keyframes rebote{
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 10px); }
  }

  /* ---------- INTRO ---------- */
  .intro{
    max-width: 620px;
    margin: 0 auto;
    padding: 64px 24px 8px;
    text-align: center;
  }

  .intro .corazon{
    font-size: 1.6rem;
    color: var(--terracota);
    margin-bottom: 12px;
  }

  .intro h2{
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin: 0 0 12px;
    text-wrap: balance;
  }

  .intro p{
    color: var(--texto-suave);
    line-height: 1.7;
    font-weight: 300;
    font-size: 1.02rem;
  }

  /* ---------- CARTA PERSONAL ---------- */
  .carta-envoltorio{
    max-width: 680px;
    margin: 40px auto 10px;
    padding: 0 20px;
  }

  .carta{
    background: var(--papel);
    border: 1px solid var(--crema-2);
    border-radius: 18px;
    padding: clamp(32px, 5vw, 56px) clamp(24px, 6vw, 60px);
    box-shadow: 0 14px 34px rgba(58, 46, 42, 0.10);
    text-align: center;
  }

  .carta .eyebrow{
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--terracota-oscuro);
    margin: 0 0 18px;
    font-weight: 600;
  }

  .carta .comilla{
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    line-height: 1;
    color: var(--terracota);
    opacity: 0.55;
    margin-bottom: -6px;
  }

  .fila-parrafo{
    position: relative;
  }

  .carta p{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.08rem, 2.6vw, 1.35rem);
    line-height: 1.75;
    color: var(--texto);
    margin: 0 0 20px;
    text-wrap: balance;
  }

  .carta .firma{
    margin-top: 28px;
    font-family: 'Poppins', sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto-suave);
  }

  .btn-agregar-parrafo{
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    color: var(--terracota-oscuro);
    background: none;
    border: 1.5px dashed var(--terracota);
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-agregar-parrafo:hover{ background: var(--crema-2); }

  /* ---------- GALERIA ---------- */
  .titulo-galeria{
    text-align: center;
    max-width: 620px;
    margin: 56px auto 0;
    padding: 0 24px;
    font-size: clamp(1.5rem, 3.6vw, 2rem);
    text-wrap: balance;
  }

  .galeria{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 90px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }

  .foto-card{
    position: relative;
    aspect-ratio: 4 / 5;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    background: var(--crema-2);
    box-shadow: 0 6px 20px rgba(58, 46, 42, 0.12);
  }

  .foto-card img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .foto-card:hover img{
    transform: scale(1.06);
  }

  .foto-card .pie{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 14px 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(20,12,10,0.72) 100%);
    color: var(--blanco);
    font-size: 0.9rem;
    font-weight: 400;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .foto-card:hover .pie,
  .foto-card:focus-visible .pie{
    opacity: 1;
    transform: translateY(0);
  }

  @media (hover: none){
    .foto-card .pie{
      opacity: 1;
      transform: none;
      background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(20,12,10,0.75) 100%);
    }
  }

  .btn-mini{
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(20,12,10,0.55);
    color: var(--blanco);
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .btn-mini:hover{ background: rgba(20,12,10,0.8); }

  .btn-borrar-parrafo{
    position: static;
    width: 26px;
    height: 26px;
    margin-left: 8px;
    background: var(--crema-2);
    color: var(--texto-suave);
    font-size: 0.8rem;
  }

  .fila-parrafo{
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 4px;
  }

  /* ---------- MODO EDICIÓN ---------- */
  [contenteditable="true"]{
    outline: 1.5px dashed var(--terracota);
    outline-offset: 4px;
    border-radius: 6px;
    cursor: text;
  }
  [contenteditable="true"]:hover{
    background: rgba(200,136,107,0.08);
  }
  [contenteditable="true"]:focus{
    outline-color: var(--terracota-oscuro);
    background: rgba(200,136,107,0.12);
  }

  .boton-flotante{
    position: fixed;
    right: max(20px, env(safe-area-inset-right, 20px));
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    background: var(--terracota-oscuro);
    color: var(--blanco);
    border: none;
    border-radius: 999px;
    padding: 14px 22px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    box-shadow: 0 10px 26px rgba(58,46,42,0.28);
    cursor: pointer;
    z-index: 50;
  }
  .boton-flotante:hover{ background: #8f5540; }

  .boton-cancelar{
    right: auto;
    left: max(20px, env(safe-area-inset-left, 20px));
    background: var(--papel);
    color: var(--texto-suave);
    border: 1px solid var(--crema-2);
    box-shadow: 0 8px 20px rgba(58,46,42,0.12);
  }
  .boton-cancelar:hover{ background: var(--crema-2); }

  .toast{
    position: fixed;
    left: 50%;
    bottom: max(88px, calc(env(safe-area-inset-bottom, 0px) + 88px));
    transform: translate(-50%, 12px);
    background: var(--texto);
    color: var(--blanco);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 0.88rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 60;
    max-width: 90vw;
    text-align: center;
  }
  .toast.mostrar{
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 10, 0.94);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
  }

  .lightbox.abierto{
    display: flex;
  }

  .lightbox-contenido{
    max-width: 900px;
    width: 100%;
    text-align: center;
  }

  .lightbox img{
    max-width: 100%;
    max-height: 74vh;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .lightbox .pie-grande{
    color: var(--blanco);
    margin-top: 18px;
    font-size: 1.05rem;
    font-weight: 300;
    min-height: 1.4em;
  }

  .lb-boton{
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.12);
    border: none;
    color: var(--blanco);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lb-boton:hover{ background: rgba(255,255,255,0.25); }
  .lb-prev{ left: 14px; }
  .lb-next{ right: 14px; }

  .lb-cerrar{
    position: fixed;
    top: max(16px, env(safe-area-inset-top, 16px));
    right: 16px;
    background: none;
    border: none;
    color: var(--blanco);
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0.85;
  }
  .lb-cerrar:hover{ opacity: 1; }

  @media (max-width: 560px){
    .lb-boton{ width: 40px; height: 40px; font-size: 1.2rem; }
    .lb-prev{ left: 6px; }
    .lb-next{ right: 6px; }
    .boton-flotante{ padding: 12px 18px; font-size: 0.85rem; }
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align: center;
    padding: 30px 20px 50px;
    color: var(--texto-suave);
    font-size: 0.85rem;
    font-weight: 300;
  }
</style>
</head>
<body>

<div id="app"></div>

<script id="datos-estado" type="application/json">{"hero":{"etiqueta":"Un álbum para nosotros","titulo":"Nuestra Historia","subtitulo":"Los momentos que más queremos recordar, en un solo lugar.","imagenFondo":"fotos/foto-05.jpeg"},"intro":{"titulo":"Cada foto, un recuerdo","texto":"Partidos de fútbol, siestas de domingo, playa, flores y una compañera de cuatro patas que no falta en ninguna aventura. Este es nuestro álbum."},"cartaPersonal":{"etiqueta":"Unas palabras","parrafos":["Escribe aquí lo que quieras decirle a esa persona especial.","Toca el botón de abajo para editar este texto, agregar otro párrafo o firmar con tu nombre."],"firma":"— Escribe tu nombre aquí"},"tituloGaleria":"El álbum","footer":"Hecho con ♥ — nuestro álbum","fotos":[{"src":"fotos/foto-05.jpeg","pie":"Nuestra sonrisa favorita"},{"src":"fotos/foto-06.jpeg","pie":"Noche de fútbol, juntos como siempre"},{"src":"fotos/foto-04.jpeg","pie":"Un beso que lo dice todo"},{"src":"fotos/foto-03.jpeg","pie":"Risas que no caben en una sola foto"},{"src":"fotos/foto-10.jpeg","pie":"Abrazados, sin nada más que decir"},{"src":"fotos/foto-02.jpeg","pie":"Los dos, tal cual somos"},{"src":"fotos/foto-01.jpeg","pie":"Ella y su compañera de siempre"},{"src":"fotos/foto-11.jpeg","pie":"Aventuras sobre el agua"},{"src":"fotos/foto-07.jpeg","pie":"Choca esos cinco"},{"src":"fotos/foto-08.jpeg","pie":"Rodeada de flores, feliz como siempre"},{"src":"fotos/foto-09.jpeg","pie":"Arena, mar y mucha energía"},{"src":"fotos/foto-12.jpeg","pie":"El amor también tiene cuatro patas"}]}</script>
<script id="logica">
(function () {

  function escaparHTML(valor) {
    return String(valor == null ? '' : valor)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function escaparAtributo(valor) {
    return escaparHTML(valor).replace(/"/g, '&quot;');
  }

  var estado = JSON.parse(document.getElementById('datos-estado').textContent);
  var modoEdicion = false;
  var indiceActual = 0;

  function construirCarta(e, ce, editando) {
    var html = '<div class="carta-envoltorio"><div class="carta">';
    html += '<p class="eyebrow"' + ce + ' data-campo="carta.etiqueta">' + escaparHTML(e.cartaPersonal.etiqueta) + '</p>';
    html += '<div class="comilla">&ldquo;</div>';
    html += '<div class="carta-parrafos">';
    e.cartaPersonal.parrafos.forEach(function (parrafo) {
      html += '<div class="fila-parrafo">';
      html += '<p' + ce + ' data-tipo="parrafo">' + escaparHTML(parrafo) + '</p>';
      if (editando && e.cartaPersonal.parrafos.length > 1) {
        html += '<button type="button" class="btn-mini btn-borrar-parrafo" title="Quitar este párrafo">&times;</button>';
      }
      html += '</div>';
    });
    if (editando) {
      html += '<button type="button" class="btn-agregar-parrafo" id="btnAgregarParrafo">+ Agregar un párrafo</button>';
    }
    html += '</div>';
    html += '<p class="firma"' + ce + ' data-campo="carta.firma">' + escaparHTML(e.cartaPersonal.firma) + '</p>';
    html += '</div></div>';
    return html;
  }

  function construirGaleria(e, ce, editando) {
    var html = '<h2 class="titulo-galeria"' + ce + ' data-campo="galeria.titulo">' + escaparHTML(e.tituloGaleria) + '</h2>';
    html += '<section class="galeria" id="galeria">';
    e.fotos.forEach(function (foto, indice) {
      html += '<div class="foto-card" data-src="' + escaparAtributo(foto.src) + '" data-indice="' + indice + '" tabindex="0">';
      html += '<img src="' + escaparAtributo(foto.src) + '" alt="' + escaparAtributo(foto.pie) + '" loading="lazy">';
      html += '<div class="pie"' + ce + ' data-tipo="pie-foto">' + escaparHTML(foto.pie) + '</div>';
      if (editando) {
        html += '<button type="button" class="btn-mini btn-borrar-foto" title="Quitar esta foto">&#128465;</button>';
      }
      html += '</div>';
    });
    html += '</section>';
    return html;
  }

  function construirCuerpoHTML(e) {
    var editando = modoEdicion;
    var ce = editando ? ' contenteditable="true"' : '';
    var html = '';

    html += '<section class="hero" style="background-image: linear-gradient(180deg, rgba(30,20,15,0.15) 0%, rgba(30,20,15,0.65) 100%), url(\'' + escaparAtributo(e.hero.imagenFondo) + '\');">';
    html += '<div class="hero-contenido">';
    html += '<p class="eyebrow"' + ce + ' data-campo="hero.etiqueta">' + escaparHTML(e.hero.etiqueta) + '</p>';
    html += '<h1' + ce + ' data-campo="hero.titulo">' + escaparHTML(e.hero.titulo) + '</h1>';
    html += '<p' + ce + ' data-campo="hero.subtitulo">' + escaparHTML(e.hero.subtitulo) + '</p>';
    html += '</div>';
    html += '<div class="scroll-cue">&#8595;</div>';
    html += '</section>';

    html += '<section class="intro">';
    html += '<div class="corazon">&#9829;</div>';
    html += '<h2' + ce + ' data-campo="intro.titulo">' + escaparHTML(e.intro.titulo) + '</h2>';
    html += '<p' + ce + ' data-campo="intro.texto">' + escaparHTML(e.intro.texto) + '</p>';
    html += '</section>';

    html += construirCarta(e, ce, editando);
    html += construirGaleria(e, ce, editando);

    html += '<div class="lightbox" id="lightbox">';
    html += '<button class="lb-cerrar" id="lbCerrar" aria-label="Cerrar">&times;</button>';
    html += '<button class="lb-boton lb-prev" id="lbPrev" aria-label="Anterior">&#8249;</button>';
    html += '<div class="lightbox-contenido"><img id="lbImagen" src="" alt=""><p class="pie-grande" id="lbPie"></p></div>';
    html += '<button class="lb-boton lb-next" id="lbNext" aria-label="Siguiente">&#8250;</button>';
    html += '</div>';

    html += '<footer' + ce + ' data-campo="footer">' + escaparHTML(e.footer) + '</footer>';

    html += '<button type="button" class="boton-flotante" id="btnModoEdicion">' + (editando ? '&#128190; Guardar cambios' : '&#9998; Editar textos') + '</button>';
    if (editando) {
      html += '<button type="button" class="boton-flotante boton-cancelar" id="btnCancelarEdicion">Cancelar</button>';
    }
    html += '<div class="toast" id="toast"></div>';

    return html;
  }

  function mostrarAviso(mensaje) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = mensaje;
    toast.classList.add('mostrar');
    window.clearTimeout(window.__avisoTimer);
    window.__avisoTimer = window.setTimeout(function () {
      toast.classList.remove('mostrar');
    }, 3200);
  }

  function abrirLightbox(indice) {
    indiceActual = indice;
    mostrarFotoLightbox();
    document.getElementById('lightbox').classList.add('abierto');
  }

  function mostrarFotoLightbox() {
    var foto = estado.fotos[indiceActual];
    if (!foto) return;
    var img = document.getElementById('lbImagen');
    img.src = foto.src;
    img.alt = foto.pie;
    document.getElementById('lbPie').textContent = foto.pie;
  }

  function cerrarLightbox() {
    document.getElementById('lightbox').classList.remove('abierto');
  }

  function fotoAnterior() {
    indiceActual = (indiceActual - 1 + estado.fotos.length) % estado.fotos.length;
    mostrarFotoLightbox();
  }

  function fotoSiguiente() {
    indiceActual = (indiceActual + 1) % estado.fotos.length;
    mostrarFotoLightbox();
  }

  function recolectarEstadoDesdeDOM() {
    function leer(campo) {
      var el = document.querySelector('[data-campo="' + campo + '"]');
      return el ? el.textContent.trim() : '';
    }
    estado.hero.etiqueta = leer('hero.etiqueta');
    estado.hero.titulo = leer('hero.titulo');
    estado.hero.subtitulo = leer('hero.subtitulo');
    estado.intro.titulo = leer('intro.titulo');
    estado.intro.texto = leer('intro.texto');
    estado.cartaPersonal.etiqueta = leer('carta.etiqueta');
    estado.cartaPersonal.firma = leer('carta.firma');
    estado.tituloGaleria = leer('galeria.titulo');
    estado.footer = leer('footer');

    var parrafos = Array.prototype.map.call(
      document.querySelectorAll('[data-tipo="parrafo"]'),
      function (p) { return p.textContent.trim(); }
    ).filter(function (t) { return t.length > 0; });
    estado.cartaPersonal.parrafos = parrafos.length ? parrafos : ['Escribe aquí tus palabras.'];

    estado.fotos = Array.prototype.map.call(
      document.querySelectorAll('.foto-card'),
      function (card) {
        return {
          src: card.getAttribute('data-src'),
          pie: card.querySelector('[data-tipo="pie-foto"]').textContent.trim(),
        };
      }
    );
  }

  async function guardarCambios() {
    recolectarEstadoDesdeDOM();

    if (!window.claude || typeof window.claude.use !== 'function') {
      mostrarAviso('La edición en vivo solo se guarda dentro de Claude.');
      modoEdicion = false;
      pintar();
      return;
    }

    var artifact = await window.claude.use('artifact');
    if (!artifact) {
      mostrarAviso('La edición en vivo no está disponible en esta ventana.');
      modoEdicion = false;
      pintar();
      return;
    }

    var estilos = document.getElementById('estilos').textContent;
    var logica = document.getElementById('logica').textContent;
    var estadoTexto = JSON.stringify(estado).replace(/</g, '\\u003c');
    var tituloPagina = escaparHTML(estado.hero.titulo || 'Nuestra Historia');

    var doc = '<!DOCTYPE html>\n<html lang="es">\n<head>\n';
    doc += '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
    doc += '<title>' + tituloPagina + '</title>\n';
    doc += '<link rel="preconnect" href="https://fonts.googleapis.com">\n';
    doc += '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n';
    doc += '<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">\n';
    doc += '<style id="estilos">' + estilos + '</style>\n';
    doc += '</head>\n<body>\n<div id="app"></div>\n';
    doc += '<' + 'script id="datos-estado" type="application/json">' + estadoTexto + '<' + '/script>\n';
    doc += '<' + 'script id="logica">' + logica + '<' + '/script>\n';
    doc += '</body>\n</html>';

    try {
      await artifact.publish(doc);
      modoEdicion = false;
      pintar();
      mostrarAviso('Cambios guardados ✓');
    } catch (err) {
      if (err && (err.code === 'not_writer' || err.code === 'not_granted')) {
        mostrarAviso('No tienes permiso para editar este álbum.');
      } else {
        mostrarAviso('No se pudo guardar. Intenta de nuevo.');
      }
      modoEdicion = true;
      pintar();
    }
  }

  function conectarEventos() {
    var galeria = document.getElementById('galeria');
    if (galeria) {
      galeria.addEventListener('click', function (ev) {
        var btnBorrar = ev.target.closest('.btn-borrar-foto');
        if (btnBorrar) {
          ev.stopPropagation();
          if (window.confirm('¿Quitar esta foto del álbum?')) {
            btnBorrar.closest('.foto-card').remove();
          }
          return;
        }
        if (modoEdicion && ev.target.isContentEditable) {
          return;
        }
        var card = ev.target.closest('.foto-card');
        if (card) {
          abrirLightbox(parseInt(card.getAttribute('data-indice'), 10));
        }
      });
      galeria.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        var card = ev.target.closest('.foto-card');
        if (card && !ev.target.isContentEditable) {
          abrirLightbox(parseInt(card.getAttribute('data-indice'), 10));
        }
      });
    }

    var app = document.getElementById('app');
    app.addEventListener('click', function (ev) {
      if (ev.target.closest('.btn-borrar-parrafo')) {
        ev.target.closest('.fila-parrafo').remove();
        return;
      }
      if (ev.target.id === 'btnAgregarParrafo') {
        var fila = document.createElement('div');
        fila.className = 'fila-parrafo';
        var p = document.createElement('p');
        p.setAttribute('contenteditable', 'true');
        p.setAttribute('data-tipo', 'parrafo');
        p.textContent = 'Escribe aquí un nuevo párrafo';
        var boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'btn-mini btn-borrar-parrafo';
        boton.title = 'Quitar este párrafo';
        boton.innerHTML = '&times;';
        fila.appendChild(p);
        fila.appendChild(boton);
        ev.target.parentNode.insertBefore(fila, ev.target);
        p.focus();
        return;
      }
      if (ev.target.id === 'btnModoEdicion') {
        if (modoEdicion) {
          guardarCambios();
        } else {
          modoEdicion = true;
          pintar();
        }
        return;
      }
      if (ev.target.id === 'btnCancelarEdicion') {
        modoEdicion = false;
        pintar();
        return;
      }
    });

    document.getElementById('lbCerrar').addEventListener('click', cerrarLightbox);
    document.getElementById('lbPrev').addEventListener('click', fotoAnterior);
    document.getElementById('lbNext').addEventListener('click', fotoSiguiente);
    document.getElementById('lightbox').addEventListener('click', function (ev) {
      if (ev.target.id === 'lightbox') cerrarLightbox();
    });
  }

  function pintar() {
    document.getElementById('app').innerHTML = construirCuerpoHTML(estado);
    conectarEventos();
  }

  document.addEventListener('keydown', function (ev) {
    var lightbox = document.getElementById('lightbox');
    if (!lightbox || !lightbox.classList.contains('abierto')) return;
    if (ev.key === 'Escape') cerrarLightbox();
    if (ev.key === 'ArrowLeft') fotoAnterior();
    if (ev.key === 'ArrowRight') fotoSiguiente();
  });

  pintar();
})();
</script>

</body>
</html>
